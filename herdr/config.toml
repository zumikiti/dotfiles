onboarding = false

[update]
channel = "stable"
version_check = true
manifest_check = true

[terminal]
default_shell = "fish"

[keys]
prefix = "ctrl+s"
split_horizontal = "prefix+a"
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
toggle_sidebar = "ctrl+b"

[[keys.command]]
key = "prefix+t"
type = "pane"
command = "tig"
description = "run tig"

[ui]
show_agent_labels_on_pane_borders = true

[session]
resume_agents_on_restore = true

[ui.sound]
enabled = false

[theme]
name = "nord"
auto_switch = false
