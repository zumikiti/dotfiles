# シェルを設定してください
run-shell 'tmux set-option -g default-shell "$(command -v fish)"'

# コピーモードのキーバインドを vi に合わせる
set-window-option -g mode-keys vi

# window name の自動設定off
set-window-option -g automatic-rename off

# set prefix key
set -g prefix C-s
unbind C-b

set-option -g history-limit 100000

# enable mouse
set-option -g mouse on

# fix remaining word
set -s set-clipboard off

# color
set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# reduce delay
set -sg escape-time 10
set-option -g repeat-time 500

# index number
set -g base-index 1
set -g pane-base-index 1

setw -g monitor-activity on

# create new window
bind c new-window -c '#{pane_current_path}'
# split window
bind v split-window -h -c '#{pane_current_path}'
bind s split-window -v -c '#{pane_current_path}'

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

# select pane
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# resize pane
bind -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 1'
bind -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 1'
bind -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 1'
bind -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 1'
bind-key -T copy-mode-vi M-h resize-pane -L 1
bind-key -T copy-mode-vi M-j resize-pane -D 1
bind-key -T copy-mode-vi M-k resize-pane -U 1
bind-key -T copy-mode-vi M-l resize-pane -R 1

# is_vim は parse 時に各 bind へ展開済みなので、環境変数としては残さない
# （pane 内シェルへの漏れを防ぐ。Astro dev の astro:env/server parse エラー対策）
setenv -gu is_vim

# remove pane
bind q kill-pane

# Vim binding
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# プラグインは TPM をやめ flox の [install] で固定管理する。
# 実体の読み込みは設定末尾の run-shell 群で行う（$FLOX_ENV を解決）。
set -g @tmux_power_theme 'sky'

# display-popup の設定
bind -n C-q run-shell "fish -c \"tmuxpopup\""
bind t display-popup \
  -d "#{pane_current_path}" \
  -xC -yC -w 90% -h 90% \
  -E "tig"

# --- flox 管理プラグインの読み込み（TPM の代替） -------------------
# tmux は flox activate 済み環境で起動するため $FLOX_ENV が解決される。
# 読み込み順は旧 @plugin の宣言順を踏襲（nord → power でテーマを上書き）。
run-shell "$FLOX_ENV/share/tmux-plugins/sensible/sensible.tmux"
run-shell "$FLOX_ENV/share/tmux-plugins/resurrect/resurrect.tmux"
run-shell "$FLOX_ENV/share/tmux-plugins/nord/nord.tmux"
run-shell "$FLOX_ENV/share/tmux-plugins/power/tmux-power.tmux"
run-shell "$FLOX_ENV/share/tmux-plugins/yank/yank.tmux"
