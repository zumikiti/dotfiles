    "hook": {
      "on-activate": "  # --- Apply dotfiles: symlink configs into place ---------------------\n  # Idempotent and silent once linked; runs on every `flox activate`\n  # (incl. fish login). A pre-existing real file is backed up to *.bak\n  # before it is replaced by a symlink.\n  dotfiles=\"$FLOX_ENV_PROJECT\"\n\n  _link() {\n    # _link <path-relative-to-dotfiles> <absolute-target>\n    src=\"$dotfiles/$1\"\n    dst=\"$2\"\n    [ -e \"$src\" ] || return 0\n    # already the right symlink? stay quiet.\n    [ \"$(readlink \"$dst\" 2>/dev/null)\" = \"$src\" ] && return 0\n    mkdir -p \"$(dirname \"$dst\")\"\n    if [ -e \"$dst\" ] && [ ! -L \"$dst\" ]; then\n      mv \"$dst\" \"$dst.bak\"\n      echo \"dotfiles: backed up $dst -> $dst.bak\"\n    fi\n    ln -sfn \"$src\" \"$dst\"\n    echo \"dotfiles: linked $dst\"\n  }\n\n  # _seed: copy a dotfiles FILE into place, overwriting the target each\n  # activate. Used for mutable runtime config (e.g. pi agent settings)\n  # that the app rewrites in place -- a symlink would dirty the repo and\n  # a one-time copy would stop propagating repo-side updates. The repo\n  # copy is the source of truth; user changes in the live file do not\n  # survive the next `flox activate`.\n  _seed() {\n    # _seed <path-relative-to-dotfiles> <absolute-target>\n    src=\"$dotfiles/$1\"\n    dst=\"$2\"\n    [ -e \"$src\" ] || return 0\n    mkdir -p \"$(dirname \"$dst\")\"\n    # Replace any pre-existing symlink with a real file (write-through\n    # would otherwise corrupt the repo); keep a one-time backup.\n    if [ -L \"$dst\" ]; then\n      rm -f \"$dst\"\n    elif [ -e \"$dst\" ] && ! cmp -s \"$src\" \"$dst\"; then\n      mv \"$dst\" \"$dst.bak\"\n      echo \"dotfiles: backed up $dst -> $dst.bak\"\n    fi\n    cp \"$src\" \"$dst\"\n    echo \"dotfiles: seeded $dst\"\n  }\n\n  # shell / tmux / tig\n  _link .tigrc            \"$HOME/.tigrc\"\n  _link .tmux.conf        \"$HOME/.tmux.conf\"\n\n  # nvim\n  _link nvim/init.lua     \"$HOME/.config/nvim/init.lua\"\n  _link nvim/lua          \"$HOME/.config/nvim/lua\"\n\n  # fish\n  _link fish/config.fish  \"$HOME/.config/fish/config.fish\"\n  _link fish/fish_plugins \"$HOME/.config/fish/fish_plugins\"\n  _link fish/posh-themes  \"$HOME/.config/fish/posh-themes\"\n\n  # alacritty\n  _link alacritty         \"$HOME/.config/alacritty\"\n\n  # shared agent rules (single source of truth; CLAUDE.md imports it)\n  _link agents/AGENTS.md     \"$HOME/.claude/AGENTS.md\"\n  _link agents/AGENTS.md     \"$HOME/.pi/agent/AGENTS.md\"\n\n  # claude code\n  _link claude/CLAUDE.md     \"$HOME/.claude/CLAUDE.md\"\n  _link claude/skills        \"$HOME/.claude/skills\"\n  _link claude/settings.json \"$HOME/.claude/settings.json\"\n\n  # pi\n  # settings.json is rewritten in place by pi on every run; seed it from\n  # the template on each activate so the repo copy stays the single\n  # source of truth (the symlink version would dirty the repo).\n  _seed pi/agent/settings.json.template \"$HOME/.pi/agent/settings.json\"\n  # custom oxlm provider definition (models.json is read-only config)\n  _link pi/agent/models.json \"$HOME/.pi/agent/models.json\"\n\n  # gh-dash\n  _link gh-dash/config.yml \"$HOME/.config/gh-dash/config.yml\"\n\n  # workmux\n  _link workmux/pr-review.yaml \"$HOME/.config/workmux/pr-review.yaml\"\n  _link workmux/pr-review-loop.yaml \"$HOME/.config/workmux/pr-review-loop.yaml\"\n\n  # macOS only: karabiner\n  if [ \"$(uname -s)\" = \"Darwin\" ]; then\n    _link karabiner.json  \"$HOME/.config/karabiner/karabiner.json\"\n  fi\n\n  unset -f _link\n\n  # --- Login bootstrap: auto-enter flox + fish on interactive login ---\n  # (Linux only) Keep a managed block in ~/.profile so interactive login\n  # shells re-enter this flox env and drop into fish. The block is fully\n  # owned by this hook -- the repo is its source of truth. POSIX-only so\n  # /bin/sh (dash) can read it; ~/.profile cannot be symlinked because it\n  # holds other system content and must exist *before* `flox activate`.\n  # No `exec`: if activation fails (bad manifest, broken env, fish missing\n  # or not runnable) the login falls back to the plain login shell instead\n  # of dying. `fish -N -c true` is the runnability probe: `command -v` alone\n  # passes a fish that exists but can't exec (126/127 would then be masked\n  # to 0 and log out on every login). fish's own exit status is masked to 0\n  # so a normal logout still exits in one go; crash statuses (132-136, 139:\n  # ILL/TRAP/ABRT/BUS/FPE/SEGV, e.g. fish crashing at startup) are passed\n  # through so the login falls back instead of disconnecting on every login.\n  # INT/HUP/TERM are masked too: fish's bare `exit` reuses the last status,\n  # so Ctrl-C then `exit` gives 130, which must still log out in one go.\n  # deliberate: sh can't tell a crash from `exit 139` after a crashed\n  # command, and other non-zero exits still log out; refine if that bites.\n  if [ \"$(uname -s)\" = \"Linux\" ]; then\n    _ensure_profile_bootstrap() {\n      profile=\"$HOME/.profile\"\n      begin=\"# >>> dotfiles flox login >>>\"\n      end=\"# <<< dotfiles flox login <<<\"\n      block=\"$begin\n# Managed by dotfiles flox env (manifest.toml). Do not edit by hand.\ncase \\$- in *i*)\n  if [ -z \\\"\\$FLOX_ENV\\\" ] && command -v flox >/dev/null 2>&1; then\n    flox activate -d \\\"\\$HOME/dotfiles\\\" -- sh -c 'fish -N -c true >/dev/null 2>&1 || exit 127; fish -l; s=\\$?; case \\$s in 13[2-6]|139) exit \\$s ;; esac; exit 0' && exit\n    echo \\\"dotfiles: flox activate or fish failed (status \\$?); staying in the login shell\\\" >&2\n  fi ;;\nesac\n$end\"\n\n      [ -e \"$profile\" ] || : > \"$profile\"\n\n      # new = the file with any prior managed block stripped, then a\n      # freshly rendered block appended. Both sides of the compare go\n      # through command substitution so trailing-newline handling matches\n      # and the rewrite (and its message) stays quiet when unchanged.\n      new=\"$(\n        awk -v b=\"$begin\" -v e=\"$end\" \\\n          '$0==b{skip=1;next} $0==e{skip=0;next} !skip{print}' \"$profile\"\n        printf '%s\\n' \"$block\"\n      )\"\n      if [ \"$new\" != \"$(cat \"$profile\")\" ]; then\n        printf '%s\\n' \"$new\" > \"$profile\"\n        echo \"dotfiles: updated flox login bootstrap in $profile\"\n      fi\n    }\n    _ensure_profile_bootstrap\n    unset -f _ensure_profile_bootstrap\n  fi\n"
    },
    "profile": {},
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux"
      ]
    }
