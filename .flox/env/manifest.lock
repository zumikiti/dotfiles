    "hook": {
      "on-activate": "  # --- Apply dotfiles: symlink configs into place ---------------------\n  # Idempotent and silent once linked; runs on every `flox activate`\n  # (incl. fish login). A pre-existing real file is backed up to *.bak\n  # before it is replaced by a symlink.\n  dotfiles=\"$FLOX_ENV_PROJECT\"\n\n  _link() {\n    # _link <path-relative-to-dotfiles> <absolute-target>\n    src=\"$dotfiles/$1\"\n    dst=\"$2\"\n    [ -e \"$src\" ] || return 0\n    # already the right symlink? stay quiet.\n    [ \"$(readlink \"$dst\" 2>/dev/null)\" = \"$src\" ] && return 0\n    mkdir -p \"$(dirname \"$dst\")\"\n    if [ -e \"$dst\" ] && [ ! -L \"$dst\" ]; then\n      mv \"$dst\" \"$dst.bak\"\n      echo \"dotfiles: backed up $dst -> $dst.bak\"\n    fi\n    ln -sfn \"$src\" \"$dst\"\n    echo \"dotfiles: linked $dst\"\n  }\n\n  # shell / tmux / tig\n  _link .tigrc            \"$HOME/.tigrc\"\n  _link .tmux.conf        \"$HOME/.tmux.conf\"\n\n  # nvim\n  _link nvim/init.lua     \"$HOME/.config/nvim/init.lua\"\n  _link nvim/lua          \"$HOME/.config/nvim/lua\"\n\n  # fish\n  _link fish/config.fish  \"$HOME/.config/fish/config.fish\"\n  _link fish/fish_plugins \"$HOME/.config/fish/fish_plugins\"\n  _link fish/posh-themes  \"$HOME/.config/fish/posh-themes\"\n\n  # alacritty\n  _link alacritty         \"$HOME/.config/alacritty\"\n\n  # claude code\n  _link claude/CLAUDE.md     \"$HOME/.claude/CLAUDE.md\"\n  _link claude/skills        \"$HOME/.claude/skills\"\n  _link claude/settings.json \"$HOME/.claude/settings.json\"\n\n  # herdr\n  _link herdr/config.toml    \"$HOME/.config/herdr/config.toml\"\n\n  # macOS only: karabiner\n  if [ \"$(uname -s)\" = \"Darwin\" ]; then\n    _link karabiner.json  \"$HOME/.config/karabiner/karabiner.json\"\n  fi\n\n  unset -f _link\n\n  # --- Login bootstrap: auto-enter flox + fish on interactive login ---\n  # (Linux only) Keep a managed block in ~/.profile so interactive login\n  # shells re-enter this flox env and drop into fish. The block is fully\n  # owned by this hook -- the repo is its source of truth. POSIX-only so\n  # /bin/sh (dash) can read it; ~/.profile cannot be symlinked because it\n  # holds other system content and must exist *before* `flox activate`.\n  if [ \"$(uname -s)\" = \"Linux\" ]; then\n    _ensure_profile_bootstrap() {\n      profile=\"$HOME/.profile\"\n      begin=\"# >>> dotfiles flox login >>>\"\n      end=\"# <<< dotfiles flox login <<<\"\n      block=\"$begin\n# Managed by dotfiles flox env (manifest.toml). Do not edit by hand.\ncase \\$- in *i*)\n  if [ -z \\\"\\$FLOX_ENV\\\" ] && command -v flox >/dev/null 2>&1; then\n    exec flox activate -d \\\"\\$HOME/dotfiles\\\" -- fish -l\n  fi ;;\nesac\n$end\"\n\n      [ -e \"$profile\" ] || : > \"$profile\"\n\n      # new = the file with any prior managed block stripped, then a\n      # freshly rendered block appended. Both sides of the compare go\n      # through command substitution so trailing-newline handling matches\n      # and the rewrite (and its message) stays quiet when unchanged.\n      new=\"$(\n        awk -v b=\"$begin\" -v e=\"$end\" \\\n          '$0==b{skip=1;next} $0==e{skip=0;next} !skip{print}' \"$profile\"\n        printf '%s\\n' \"$block\"\n      )\"\n      if [ \"$new\" != \"$(cat \"$profile\")\" ]; then\n        printf '%s\\n' \"$new\" > \"$profile\"\n        echo \"dotfiles: updated flox login bootstrap in $profile\"\n      fi\n    }\n    _ensure_profile_bootstrap\n    unset -f _ensure_profile_bootstrap\n  fi\n"
    },
    "profile": {},
    "options": {}
  },
