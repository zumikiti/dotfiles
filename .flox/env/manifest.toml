## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
on-activate = '''
  # --- Apply dotfiles: symlink configs into place ---------------------
  # Idempotent and silent once linked; runs on every `flox activate`
  # (incl. fish login). A pre-existing real file is backed up to *.bak
  # before it is replaced by a symlink.
  dotfiles="$FLOX_ENV_PROJECT"

  _link() {
    # _link <path-relative-to-dotfiles> <absolute-target>
    src="$dotfiles/$1"
    dst="$2"
    [ -e "$src" ] || return 0
    # already the right symlink? stay quiet.
    [ "$(readlink "$dst" 2>/dev/null)" = "$src" ] && return 0
    mkdir -p "$(dirname "$dst")"
    if [ -e "$dst" ] && [ ! -L "$dst" ]; then
      mv "$dst" "$dst.bak"
      echo "dotfiles: backed up $dst -> $dst.bak"
    fi
    ln -sfn "$src" "$dst"
    echo "dotfiles: linked $dst"
  }

  # shell / tmux / tig
  _link .tigrc            "$HOME/.tigrc"
  _link .tmux.conf        "$HOME/.tmux.conf"

  # nvim
  _link nvim/init.lua     "$HOME/.config/nvim/init.lua"
  _link nvim/lua          "$HOME/.config/nvim/lua"

  # fish
  _link fish/config.fish  "$HOME/.config/fish/config.fish"
  _link fish/fish_plugins "$HOME/.config/fish/fish_plugins"
  _link fish/posh-themes  "$HOME/.config/fish/posh-themes"

  # alacritty
  _link alacritty         "$HOME/.config/alacritty"

  # claude code
  _link claude/CLAUDE.md     "$HOME/.claude/CLAUDE.md"
  _link claude/skills        "$HOME/.claude/skills"
  _link claude/settings.json "$HOME/.claude/settings.json"

  # agents / opencode / pi
  _link agents/AGENTS.md          "$HOME/.config/opencode/AGENTS.md"
  _link agents/AGENTS.md          "$HOME/.pi/agent/AGENTS.md"
  _link opencode/opencode.json    "$HOME/.config/opencode/opencode.json"
  _link opencode/agents           "$HOME/.config/opencode/agents"

  # pi
  _link pi/agent/settings.json "$HOME/.pi/agent/settings.json"

  # herdr
  _link herdr/config.toml    "$HOME/.config/herdr/config.toml"

  # gh-dash
  _link gh-dash/config.yml "$HOME/.config/gh-dash/config.yml"

  # macOS only: karabiner
  if [ "$(uname -s)" = "Darwin" ]; then
    _link karabiner.json  "$HOME/.config/karabiner/karabiner.json"
  fi

  unset -f _link

  # --- Login bootstrap: auto-enter flox + fish on interactive login ---
  # (Linux only) Keep a managed block in ~/.profile so interactive login
  # shells re-enter this flox env and drop into fish. The block is fully
  # owned by this hook -- the repo is its source of truth. POSIX-only so
  # /bin/sh (dash) can read it; ~/.profile cannot be symlinked because it
  # holds other system content and must exist *before* `flox activate`.
  if [ "$(uname -s)" = "Linux" ]; then
    _ensure_profile_bootstrap() {
      profile="$HOME/.profile"
      begin="# >>> dotfiles flox login >>>"
      end="# <<< dotfiles flox login <<<"
      block="$begin
# Managed by dotfiles flox env (manifest.toml). Do not edit by hand.
case \$- in *i*)
  if [ -z \"\$FLOX_ENV\" ] && command -v flox >/dev/null 2>&1; then
    exec flox activate -d \"\$HOME/dotfiles\" -- fish -l
  fi ;;
esac
$end"

      [ -e "$profile" ] || : > "$profile"

      # new = the file with any prior managed block stripped, then a
      # freshly rendered block appended. Both sides of the compare go
      # through command substitution so trailing-newline handling matches
      # and the rewrite (and its message) stays quiet when unchanged.
      new="$(
        awk -v b="$begin" -v e="$end" \
          '$0==b{skip=1;next} $0==e{skip=0;next} !skip{print}' "$profile"
        printf '%s\n' "$block"
      )"
      if [ "$new" != "$(cat "$profile")" ]; then
        printf '%s\n' "$new" > "$profile"
        echo "dotfiles: updated flox login bootstrap in $profile"
      fi
    }
    _ensure_profile_bootstrap
    unset -f _ensure_profile_bootstrap
  fi
'''


