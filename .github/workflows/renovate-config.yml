name: Renovate Config

# renovate.json は Dotfiles CI (Lua lint) では検証されないため、
# 設定が壊れていてもマージできてしまう。本ワークフローで塞ぐ。
on:
  # Renovate App の版が上がったときに手で再検証できるように
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - renovate.json
      - .github/workflows/renovate-config.yml
  pull_request:
    branches: [ main ]
    paths:
      - renovate.json
      - .github/workflows/renovate-config.yml

# 外部パッケージ (renovate) を実行するため、トークン権限は読み取りのみに絞る
permissions:
  contents: read

jobs:
  validate:
    name: Validate renovate.json
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # 後続の npx が第三者コードを動かすためトークンを .git/config に残さない
          persist-credentials: false

      # renovate@44 は Node ^24.11 を要求する。ランナー既定の Node 22 では動かない
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # 引数なしで実行すると renovate.json をリポジトリ設定として自動検出する。
      # --strict: 移行が必要な旧キー (fileMatch, config:base 等) も失敗扱いにする
      # RENOVATE_VERSION は上の annotation を customManagers:githubActionsVersions が拾い、
      # Renovate が自動で更新 PR を出す。node-version は renovate の engines.node
      # (現在 ^24.11.0) に収まる範囲で手で上げる。renovate.json で node の major 更新を
      # 無効にしているのはそのため
      - name: Validate renovate config
        env:
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: 44.132.2
        run: npx --yes --package renovate@${RENOVATE_VERSION} -- renovate-config-validator --strict
